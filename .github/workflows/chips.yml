name: chips・盤後籌碼
# 執行紀錄標題帶盤前 / 盤後與觸發來源,tools/trigger-report.mjs 靠它統計排程可靠度
run-name: 籌碼 ${{ inputs.premarket == 'true' && '盤前' || '盤後' }} ${{ inputs.via || github.event_name }}

on:
  # 盤前 / 盤後 / 補永豐由 Cloudflare Worker + cron-job.org 準時打 workflow_dispatch(兩路並行,見 cloudflare/README.md)。
  # GitHub 自己的 15:40 / 16:40 備援實際每晚 22:00–03:00 才跑,只多出無用 run 與 commit,2026-10-04 拿掉。
  schedule:
    - cron: "30 13 * * 1-5"  # 台北 21:30 補融資餘額(只有這班靠 GitHub,晚到也無妨)
    - cron: "0 1 * * 0"      # 週日 09:00 週報草稿
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYY/MM/DD（留空＝最近交易日）"
        required: false
        default: ""
      weekly:
        description: "只產生週報草稿（true/false）"
        required: false
        default: "false"
      source:
        description: "觸發來源：cron（Cloudflare 排程，會 LINE 通知）／manual（手動，不通知）"
        required: false
        default: "manual"
      backfill:
        description: "往回補 N 個交易日（20 日走勢用；0 = 不回補，只抓最近一日）"
        required: false
        default: "0"
      force:
        description: "回補時連已存在的日子也重寫（補 VIX / 今日解讀等新欄位）"
        required: false
        default: "false"
      via:
        description: "觸發來源(cloudflare / cronjob;統計排程可靠度用,不影響執行)"
        required: false
        default: "manual"
      premarket:
        description: "只跑盤前資料（美股 / 夜盤 / 台股前收；true/false）。平日 07:25/07:30、週日 12:00(先發週一)由 cron-job.org / Cloudflare 打進來,GitHub 不排程"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: chips-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ref: main = 開跑當下的最新版,不是觸發當下的 commit。Cloudflare 與 cron-job.org 15:40 都會打,第二個 run 排隊等第一個跑完;
      # 不指定的話它拿到的是舊版(沒有第一個 run 的資料與 notified.json)→ push 衝突失敗,或更糟:再發一次 LINE(2026-10-02 15:40)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip                                   # 套件快取:requirements 沒變就不重新下載
          cache-dependency-path: chips/requirements.txt
      - run: pip install -q -r chips/requirements.txt
      # 圖卡要中文字型(週報那班不畫圖,不裝)。字型檔快取在 ~/.cache/fonts-cjk,命中就不跑 apt(省 10–20 秒);
      # render_card.py 讀 CARD_FONT / CARD_FONT_BOLD / CARD_FONT_INDEX(3 = 繁中 TC)
      - name: 中文字型快取
        id: fontcache
        if: ${{ github.event.schedule != '0 1 * * 0' && github.event.inputs.weekly != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fonts-cjk
          key: fonts-noto-cjk-v1
      - name: 中文字型(圖卡用)
        if: ${{ github.event.schedule != '0 1 * * 0' && github.event.inputs.weekly != 'true' && steps.fontcache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          mkdir -p ~/.cache/fonts-cjk
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc ~/.cache/fonts-cjk/ || echo "::warning::字型檔路徑變了,圖卡改用系統字型(render_card 會自己找)"
      - name: 字型路徑給圖卡
        if: ${{ github.event.schedule != '0 1 * * 0' && github.event.inputs.weekly != 'true' }}
        run: |
          echo "CARD_FONT=$HOME/.cache/fonts-cjk/NotoSansCJK-Regular.ttc" >> "$GITHUB_ENV"
          echo "CARD_FONT_BOLD=$HOME/.cache/fonts-cjk/NotoSansCJK-Bold.ttc" >> "$GITHUB_ENV"
          echo "CARD_FONT_INDEX=3" >> "$GITHUB_ENV"

      - name: 抓資料（盤後）
        if: ${{ github.event.schedule != '0 1 * * 0' && github.event.inputs.weekly != 'true' && github.event.inputs.premarket != 'true' }}
        # backfill > 0 → 只回補歷史(不抓永豐圖、不動 latest.json、不通知),之後再照常跑一次當日即可
        run: python chips/scripts/fetch_all.py ${{ github.event.inputs.date }} ${{ github.event.inputs.backfill && github.event.inputs.backfill != '0' && format('--backfill {0}', github.event.inputs.backfill) || '' }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: 週報草稿
        if: ${{ github.event.schedule == '0 1 * * 0' || github.event.inputs.weekly == 'true' }}
        run: python chips/scripts/weekly_report.py

      # 盤前(平日 07:25/07:30;週日 12:00 先發週一 —— 週末跑時 premarket.py 標成下週一,週一早上那班同日已發只更新網站):美股收盤 / 債匯金油 / 台指期夜盤 / 台股前收
      # → data/premarket_*.json;抓不到的欄位標【缺】,不亂猜。這一班不跑盤後抓資料、不發盤後 LINE;盤前 LINE 同一天只發一次(premarket_notified.json)。
      - name: 盤前資料（美股 / 夜盤 / 台股前收）
        if: ${{ github.event.inputs.premarket == 'true' }}
        run: python chips/scripts/premarket.py

      # 圖卡(1080 寬 PNG,data/card_post|pre_YYYYMMDD.png,留 30 天):LINE 傳圖要公開網址,所以先畫、先 commit,等 Pages 部署完才發 LINE
      - name: 畫圖卡（盤後）
        if: ${{ github.event.schedule != '0 1 * * 0' && github.event.inputs.weekly != 'true' && github.event.inputs.premarket != 'true' && (github.event.inputs.backfill == '' || github.event.inputs.backfill == '0' || github.event.inputs.backfill == null) }}
        continue-on-error: true
        run: python chips/scripts/render_card.py post

      - name: 畫圖卡（盤前）
        if: ${{ github.event.inputs.premarket == 'true' }}
        continue-on-error: true
        run: python chips/scripts/render_card.py pre

      - name: Commit
        run: |
          bash chips/scripts/commit_push.sh "chips:"

      # 通知時機:Cloudflare Worker / cron-job.org 打進來的 dispatch(inputs.source=cron)。
      # 手動 Run workflow / 頁面「立即抓取」/ 21:30 補融資 都不通知。同一交易日 notify.py 只送一次。
      # 想手動試訊息:本機 python chips/scripts/notify.py --dry-run
      # 在 Commit 之後:notify 會等 Pages 上的圖卡跟剛畫的一樣(最多 4 分鐘)才傳圖,逾時就只發文字
      - name: LINE 通知（排程 / Cloudflare cron）
        if: ${{ github.event.inputs.source == 'cron' && github.event.inputs.premarket != 'true' }}
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SITE_URL: https://jye-tsai.github.io/stock-dashboard/chips/
        run: python chips/scripts/notify.py || true

      - name: LINE 通知（盤前）
        if: ${{ github.event.inputs.premarket == 'true' }}
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SITE_URL: https://jye-tsai.github.io/stock-dashboard/chips/
        run: python chips/scripts/notify_premarket.py || true

      - name: Commit（通知標記）
        run: |
          bash chips/scripts/commit_push.sh "chips: notified"

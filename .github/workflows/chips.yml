name: 台股盤後籌碼抓取

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 台北 15:40
    - cron: "40 8 * * 1-5"   # 台北 16:40 補永豐
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYY/MM/DD（留空＝最近交易日）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: chips-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas beautifulsoup4 pymupdf

      - name: 抓資料
        run: python chips/scripts/fetch_all.py ${{ github.event.inputs.date }}

      - name: Commit
        run: |
          git config user.name  "panghu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add chips/data
          git diff --cached --quiet && echo "no change" || git commit -m "chips: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') 盤後籌碼"
          git push

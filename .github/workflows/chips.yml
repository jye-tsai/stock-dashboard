name: chips・盤後籌碼

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 台北 15:40 盤後
    - cron: "40 8 * * 1-5"   # 台北 16:40 補永豐
    - cron: "30 13 * * 1-5"  # 台北 21:30 補融資餘額
    - cron: "0 1 * * 0"      # 週日 09:00 週報草稿
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYY/MM/DD（留空＝最近交易日）"
        required: false
        default: ""
      weekly:
        description: "只產生週報草稿（true/false）"
        required: false
        default: "false"
      source:
        description: "觸發來源：cron（Cloudflare 排程，會 LINE 通知）／manual（手動，不通知）"
        required: false
        default: "manual"
      backfill:
        description: "往回補 N 個交易日（20 日走勢用；0 = 不回補，只抓最近一日）"
        required: false
        default: "0"
      force:
        description: "回補時連已存在的日子也重寫（補 VIX / 今日解讀等新欄位）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: chips-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas beautifulsoup4 pymupdf cryptography

      - name: 抓資料
        if: ${{ github.event.schedule != '0 1 * * 0' && github.event.inputs.weekly != 'true' }}
        # backfill > 0 → 只回補歷史(不抓永豐圖、不動 latest.json、不通知),之後再照常跑一次當日即可
        run: python chips/scripts/fetch_all.py ${{ github.event.inputs.date }} ${{ github.event.inputs.backfill && github.event.inputs.backfill != '0' && format('--backfill {0}', github.event.inputs.backfill) || '' }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # 通知時機:GitHub 15:40 排程,或 Cloudflare Worker 準時打進來的 dispatch(inputs.source=cron;跟收盤價更新同一套機制,
      # GitHub 自己的 schedule 只是備援)。手動 Run workflow / 頁面「立即抓取」source=manual 不通知。同一交易日 notify.py 只送一次。
      # 想手動試訊息:本機 python chips/scripts/notify.py --dry-run
      - name: LINE 通知（排程 / Cloudflare cron）
        if: ${{ github.event.schedule == '40 7 * * 1-5' || github.event.inputs.source == 'cron' }}
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SITE_URL: https://jye-tsai.github.io/stock-dashboard/chips/
        run: python chips/scripts/notify.py || true

      - name: 週報草稿
        if: ${{ github.event.schedule == '0 1 * * 0' || github.event.inputs.weekly == 'true' }}
        run: python chips/scripts/weekly_report.py

      - name: Commit
        run: |
          git config user.name  "panghu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add chips/data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chips: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
          # 收盤價排程每 10 分鐘會 push data.json,可能落在 checkout 與 push 之間 → 先 rebase 再 push,失敗重試 3 次(同 update-prices.yml)
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "push 失敗,重試 $i"; sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::push 三次都失敗"; exit 1; }

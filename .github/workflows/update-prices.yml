name: update-prices・股價更新
# 執行紀錄標題帶觸發來源(cloudflare / cronjob / web / button / schedule…),tools/trigger-report.mjs 靠它統計排程可靠度
run-name: 股價 ${{ inputs.via || github.event_name }}
 
on:
  # 備援排程:與 Cloudflare Worker 雙保險,任一邊漏跑另一邊補。
  # UTC(台北 = +8);分鐘錯開整點避開 GitHub 尖峰;hours 1-6 = 台北 09:00–14:50;每天跑、週末由腳本擋掉。
  schedule:
    - cron: "5,20,35,50 1-6 * * *"
  workflow_dispatch:
    inputs:
      via:
        description: "觸發來源(cloudflare / cronjob / web / button;統計排程可靠度用,不影響執行)"
        required: false
        default: "manual"
 
permissions:
  contents: write
 
concurrency:
  group: update-prices
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main          # 開跑當下的最新版(排隊等前一個 run 時,不用拿舊版再衝突重跑)
 
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
 
      # 抓價 → commit → push;push 被拒(儀表板剛好「儲存」,data.json 是單行加密檔,rebase 必衝突)
      # → 丟掉這輪,重抓 repo 最新的 data.json 再跑一次腳本,最多 3 輪。使用者的編輯永遠保留,價格用重跑後的新值。
      - name: Fetch prices, commit and push
        env:
          # 停損 / 目標價 / 排程斷線提醒用(沒設就只寫 log)
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            node scripts/update-prices.mjs
            if [ -z "$(git status --porcelain data.json stocks.json)" ]; then echo "no change"; exit 0; fi
            git add data.json stocks.json
            git commit -q -m "auto update prices $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            if git push origin HEAD:main; then echo "pushed data.json"; exit 0; fi
            echo "push 被拒(repo 剛有新 commit),重抓最新版重跑 $i"
            sleep 3
            git fetch -q origin main && git reset -q --hard origin/main
            export LINE_RETRY=1                     # 第一輪已推過 LINE,重跑只記狀態不重送
          done
          echo "::error::push 三次都失敗"; exit 1

name: update-prices・股價更新
 
on:
  # 備援排程:與 Cloudflare Worker 雙保險,任一邊漏跑另一邊補。
  # UTC(台北 = +8);分鐘錯開整點避開 GitHub 尖峰;hours 1-6 = 台北 09:00–14:50;每天跑、週末由腳本擋掉。
  schedule:
    - cron: "5,20,35,50 1-6 * * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
concurrency:
  group: update-prices
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
 
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
 
      - name: Fetch prices and write data.json
        run: node scripts/update-prices.mjs
 
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data.json stocks.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json stocks.json
            git commit -m "auto update prices $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            # 儀表板手動「儲存」會直接 PUT 到 repo,可能落在 checkout 與 push 之間 → 先 rebase 再 push,失敗重試 3 次
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "push 失敗,重試 $i"; sleep 5
            done
            [ "$pushed" = 1 ] || { echo "push 失敗三次,放棄"; exit 1; }
            echo "pushed data.json"
          else
            echo "no change"
          fi
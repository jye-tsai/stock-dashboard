name: check

# 每次 push / PR 都跑:語法檢查 + calc.js / sw.js 單元測試(node tests/run.mjs)。
# 用 GitHub 網頁拖檔上傳也算 push,紅燈就代表上錯 / 漏檔,不用等使用者開頁面才發現。
on:
  push:
    paths-ignore:
      - "data.json"          # 排程每 15 分鐘 commit 一次 data.json,那些不用跑
      - "stocks.json"        # 股票池,同一支排程每天 14:00 更新
      - "chips/data/**"      # 籌碼站每天盤後 commit 的資料
      - "chips/backtest/raw/**"
      - "chips/backtest/*.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Syntax + unit tests
        run: node tests/run.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax (chips)
        run: |
          python -m py_compile chips/scripts/fetch_all.py chips/scripts/notify.py chips/scripts/weekly_report.py chips/scripts/backtest.py chips/scripts/panghu_v3.py
          python -c "import json; [json.load(open(f, encoding='utf-8')) for f in ['chips/panghu.json', 'chips/panghu_v2.json', 'chips/panghu_v3.json']]; print('panghu json OK')"

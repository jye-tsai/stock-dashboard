<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>胖虎指標回測</title>
<meta name="theme-color" content="#172A52">
<style>
:root{--bg:#F8F4E8;--navy:#172A52;--gold:#B0842C;--gray:#696970;--ink:#23232A;--card:#fff;--line:#46588233;
  --c-red:#D9363E;--c-green:#1E9A5A;--c-gold:#C89A3A;--teal:#0F9D8A;--c-blue:#3A6FD9}
@media (prefers-color-scheme:dark){:root{--bg:#12182a;--card:#1c2440;--ink:#eee;--gray:#a8adbd;--line:#ffffff22;--c-red:#FF6B6B;--c-green:#3ECF8E;--c-gold:#F2C35B;--teal:#2DD4BF;--c-blue:#7AA2FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC",-apple-system,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:2px solid var(--gold);background:#fff}
header h1{font-size:18px;margin:0;line-height:1.2}header .sub{font-size:12px;color:#FFD682}
header .sp{flex:1}
header a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;white-space:nowrap;flex:none}
header>div:nth-child(2){min-width:0}
main{max-width:980px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;overflow:hidden}
.v2old>summary{cursor:pointer;font-weight:700;padding:12px 16px;border:1px dashed var(--line);border-radius:14px;margin-bottom:12px;color:var(--gray);list-style-position:inside}
.v2old[open]>summary{margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--gold)}
.mut{color:var(--gray)}.sm{font-size:12px}
.up{color:var(--c-red)}.dn{color:var(--c-green)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--gray);font-weight:600;border-top:none}
td:first-child,th:first-child{text-align:left}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-size:11px;fill:var(--gray)}
.flag{font-weight:700;border-radius:6px;padding:1px 6px;font-size:12px}
.flag.ok{background:#3ECF8E26;color:var(--teal)}.flag.bad{background:#FF6B6B26;color:var(--c-red)}.flag.warn{background:#F2C35B26;color:var(--c-gold)}.flag.few{color:var(--gray)}
.grp td{background:color-mix(in srgb,var(--gold) 10%,transparent);font-weight:700;color:var(--gold);text-align:left}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.kpi .l{font-size:12px;color:var(--gray)}.kpi .v{font:700 20px/1.2 ui-monospace,monospace}
ul{margin:0;padding-left:20px}li{margin:3px 0}
label.chk{font-size:13px;display:inline-flex;gap:6px;align-items:center;margin-bottom:8px;cursor:pointer}
.ex{white-space:normal;text-align:left;color:var(--gray);font-size:12px;min-width:220px}
</style>
</head>
<body>
<header>
  <img src="../../panghu-icon.webp" alt="胖虎" onerror="this.style.display='none'">
  <div><h1>胖虎指標回測</h1><div class="sub" id="hdr">讀取中…</div></div>
  <div class="sp"></div>
  <a href="../" title="回籌碼站">↩ 籌碼站</a>
</header>
<main id="app"><div class="card mut">讀取 result.json…</div></main>
<script>
const $=s=>document.querySelector(s);
const pc=(x,d=1)=>x==null?'—':(x>0?'+':'')+(x*100).toFixed(d)+'%';
const pc0=(x)=>x==null?'—':(x*100).toFixed(0)+'%';
const cl=x=>x==null?'':x>0?'up':x<0?'dn':'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS={panghu_live:'var(--c-gold)',panghu_full:'var(--teal)',buy_hold:'var(--c-red)',fixed_half:'var(--gray)',panghu_v3:'var(--c-blue)'};

// 折線圖:series=[{name,color,v:[...],dash}];labels=[日期]
function lineChart(series,labels,o={}){
  const W=900,H=o.h||240,pl=48,pr=10,pt=10,pb=22;
  const all=series.flatMap(s=>s.v).filter(v=>v!=null);if(!all.length)return '';
  let mn=o.min!=null?o.min:Math.min(...all),mx=o.max!=null?o.max:Math.max(...all);if(mn===mx){mn-=1;mx+=1}
  const n=labels.length,X=i=>pl+i*(W-pl-pr)/Math.max(1,n-1),Y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  let s=`<svg class="ch" viewBox="0 0 ${W} ${H}">`;
  (o.bands||[]).forEach(b=>{s+=`<rect x="${pl}" y="${Y(b[1])}" width="${W-pl-pr}" height="${Y(b[0])-Y(b[1])}" fill="${b[2]}"/>`});
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-5}" y="${y+4}" text-anchor="end">${o.fmt?o.fmt(v):v.toFixed(0)}</text>`}
  if(o.ref!=null)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke="var(--gray)" stroke-dasharray="4 4"/>`;
  series.forEach(se=>{let d='',pen=false;se.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);pen=true});
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.w||2}" ${se.dash?`stroke-dasharray="${se.dash}"`:''} stroke-linejoin="round"/>`});
  const ticks=[0,Math.floor(n/2),n-1];ticks.forEach((i,j)=>{s+=`<text x="${X(i)}" y="${H-5}" text-anchor="${j===0?'start':j===2?'end':'middle'}">${labels[i]||''}</text>`});
  return s+'</svg>'+(o.legend===false?'':`<div class="legend">${series.map(x=>`<span><i style="background:${x.color}"></i>${esc(x.name)}</span>`).join('')}</div>`);
}

function render(R,S){
  $('#hdr').textContent=`${R.range[0]} ～ ${R.range[1]}・${R.n_days} 個交易日・設定 v${R.config_version}・產生 ${R.generated_at.replace('T',' ')}`;
  const st=R.strategy, keys=['panghu_live','panghu_full','buy_hold','fixed_half'].concat(st.all.panghu_v3?['panghu_v3']:[]);
  const L=st.all.panghu_live,B=st.all.buy_hold;
  let h='';
  if(S&&!S.complete)h+=`<div class="card" style="border-color:var(--c-gold)"><b>資料尚未抓完</b>:已抓 ${S.ok} / ${S.trading_days} 天。到 GitHub Actions 再跑一次 backtest,會接著抓。</div>`;

  // 判斷準確度(主要看這張)
  const J=R.judgment;
  if(J){const nm=J.names,f2=x=>x==null?'—':x.toFixed(2),lift=x=>x==null?'—':'×'+x.toFixed(2);
    const order=['v3','v2','ma60','always_bull'].filter(k=>J.direction[k]);
    const dirRow=k=>{const v=J.direction[k];return `<tr><td>${esc(nm[k])}</td><td><b>${f2(v.balanced)}</b></td><td>${pc0(v.cov_bull)}</td><td>${pc0(v.prec_bull)}<div class="sm mut">基準 ${pc0(v.base_up)}・${lift(v.lift_bull)}</div></td><td>${pc0(v.cov_bear)}</td><td>${pc0(v.prec_bear)}<div class="sm mut">基準 ${pc0(v.base_down)}・${lift(v.lift_bear)}</div></td></tr>`};
    const regRow=k=>{const v=J.regime[k];if(!v)return '';return `<tr><td>${esc(nm[k])}</td><td><b>${f2(v.balanced)}</b></td><td>${pc0(v.prec_bull)}<div class="sm mut">基準 ${pc0(v.base_up)}</div></td><td>${pc0(v.prec_bear)}<div class="sm mut">基準 ${pc0(v.base_down)}</div></td></tr>`};
    const stb=J.stability||{};
    h+=`<div class="card" style="border-color:var(--c-gold)"><h2>判斷準確度(主要看這張)</h2>
      <div class="sm" style="margin-bottom:6px">方向:判偏多 / 偏空之後 20 日真的漲 / 跌超過 2% 嗎?平衡準確率 = 漲、平、跌三類各自猜中比例的平均,「永遠偏多」固定約 0.33,要贏過笨方法才算有判斷力。</div>
      <div class="tw"><table><tr><th>方法</th><th>平衡準確率</th><th>判偏多占</th><th>偏多命中</th><th>判偏空占</th><th>偏空命中</th></tr>${order.map(dirRow).join('')}</table></div>
      <div class="sm" style="margin:10px 0 6px">環境:判多 / 空之後 60 日真的漲 / 跌超過 5% 嗎?</div>
      <div class="tw"><table><tr><th>方法</th><th>平衡準確率</th><th>判多命中</th><th>判空命中</th></tr>${['v3','v2','ma60','always_bull'].map(regRow).join('')}</table></div>
      <div class="sm" style="margin:10px 0 6px">穩定度與誤報:翻空後 40 天反而更高、翻多後 40 天反而更低,算誤報。</div>
      <div class="tw"><table><tr><th>方法</th><th>判讀每年變幾次</th><th>翻空次數 / 誤報</th><th>翻多次數 / 誤報</th></tr>${['v3','v2','ma60'].filter(k=>stb[k]).map(k=>{const v=stb[k];return `<tr><td>${esc(nm[k])}</td><td>${v.call_changes_per_year}${v.regime_changes_per_year!=null?`<div class="sm mut">環境 ${v.regime_changes_per_year}</div>`:''}</td><td>${v.to_bear.n} / ${v.to_bear.false}(${pc0(v.to_bear.false_rate)})</td><td>${v.to_bull.n} / ${v.to_bull.false}(${pc0(v.to_bull.false_rate)})</td></tr>`}).join('')}</table></div>
      ${(J.turns||[]).length?`<div class="sm" style="margin:10px 0 6px">真下跌的轉折:從前高算第幾天判空、谷底後第幾天判多</div><div class="tw"><table><tr><th>事件</th>${['v3','v2','ma60'].filter(k=>J.turns[0][k]).map(k=>`<th>${esc(nm[k])}</th>`).join('')}</tr>
        ${J.turns.map(t=>`<tr><td>${t.peak} → ${t.trough}<div class="sm dn">${pc(t.depth)}</div></td>${['v3','v2','ma60'].filter(k=>t[k]).map(k=>{const g=t[k];return `<td>判空 ${g.bear_days==null?'沒判':'第 '+g.bear_days+' 天'}${g.bear_dd!=null?`<div class="sm mut">當時 ${pc(g.bear_dd)}</div>`:''}判多 ${g.bull_days==null?'沒判':'谷底後 '+g.bull_days+' 天'}${g.bull_gain!=null?`<div class="sm mut">已漲 ${pc(g.bull_gain)}</div>`:''}</td>`}).join('')}</tr>`).join('')}</table></div>`:''}
      ${(J.states||[]).length?`<div class="sm" style="margin:10px 0 6px">v3 各狀態之後 20 日的表現(狀態有用 = 多頭類之後漲得多、空頭類之後跌得多)</div><div class="tw"><table><tr><th>狀態</th><th>天數</th><th>之後 20 日平均</th><th>漲超過 2%</th><th>跌超過 2%</th></tr>
        ${J.states.map(x=>`<tr><td>${esc(x.state)}</td><td>${x.n}</td><td class="${cl(x.fwd20)}">${pc(x.fwd20,2)}</td><td>${pc0(x.up20)}</td><td>${pc0(x.down20)}</td></tr>`).join('')}</table></div>`:''}
      <div class="sm mut" style="margin-top:6px">${esc(J.notes||'')}</div></div>`;}

  // 現行 v4:極端事件 + 趨勢狀態 + 位置百分位分布
  const ES=R.events_summary||{},TS=R.trend_states||{},PD=R.position_dist||{};
  if(Object.keys(ES).length||Object.keys(TS).length){
    const f1=x=>x==null?'—':(+x).toLocaleString(undefined,{maximumFractionDigits:2});
    h+=`<div class="card"><h2>現行 v4:極端事件與趨勢狀態(10 年)</h2>
      <div class="sm" style="margin-bottom:6px">v4 只描述現況,不預測、不給倉位。極端事件同一波(相隔 10 個交易日內)只算一次。</div>
      <div class="tw"><table><tr><th>極端事件</th><th>獨立次數</th><th>之後 20 日</th><th>20 日中位數</th><th>20 日內最深再跌</th><th>空頭排列中</th></tr>
      ${Object.values(ES).map(v=>{const b=v.in_bear||{};return `<tr><td>${esc(v.name)}<div class="sm mut">${v.n_days} 天</div></td><td>${v.n}</td><td>${v.up20} 漲 ${v.down20} 跌</td><td class="${cl(v.median20)}">${pc(v.median20)}</td><td class="dn">${pc(v.worst_dd20)}</td><td>${b.n?`${b.n} 次:${b.up20} 漲 ${b.down20} 跌`:'—'}</td></tr>`}).join('')}</table></div>
      <div class="tw" style="margin-top:10px"><table><tr><th>趨勢狀態</th><th>天數(段數)</th><th>之後 20 日中位數</th><th>之後 20 日上漲機率</th></tr>
      ${Object.entries(TS).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.days}(${v.runs})</td><td class="${cl(v.median20)}">${pc(v.median20)}</td><td>${pc0(v.up20)}</td></tr>`).join('')}</table></div>
      ${Object.keys(PD).length?`<div class="sm" style="margin:10px 0 6px">位置百分位的歷史分布(每天盤後拿今天的值來對,算出第幾百分位)</div>
      <div class="tw"><table><tr><th>指標</th><th>資料</th><th>極低 ≤ 第 5</th><th>偏低 ≤ 第 20</th><th>中位數</th><th>偏高 ≥ 第 80</th><th>極高 ≥ 第 95</th></tr>
      ${Object.values(PD).map(v=>{const u=x=>x==null?'—':f1(x)+(v.unit==='口'?' 口':v.unit||'');return `<tr><td>${esc(v.name)}</td><td>${v.years} 年<div class="sm mut">${v.n} 天</div></td><td>${u(v.p5)}</td><td>${u(v.p20)}</td><td><b>${u(v.p50)}</b></td><td>${u(v.p80)}</td><td>${u(v.p95)}</td></tr>`}).join('')}</table></div>`:''}
      <div class="sm mut" style="margin-top:6px">趨勢狀態之後的表現差異不大(空頭排列之後 20 日平均反而是漲的),所以 v4 不拿它預測,只當作背景。</div></div>`;
  }

  // 波動 / 風險回測
  const RK=R.risk;
  if(RK&&RK.groups){
    const f2=x=>x==null?'—':(+x).toFixed(2);
    h+=`<div class="card"><h2>波動 / 風險回測(風險面向的依據)</h2>
      <div class="sm" style="margin-bottom:6px">近 ${RK.days} 日實際波動 = 加權指數日報酬的標準差(年化)。分組只跟當天以前近 3 年比,不偷看未來。期間 ${RK.range[0]} ～ ${RK.range[1]}・${RK.n} 天。</div>
      <div class="tw"><table><tr><th>問題</th><th>結果</th><th>結論</th></tr>
        <tr><td>今天的波動能預測接下來 ${RK.days} 日的波動嗎</td><td>相關 全期 ${f2(RK.corr.all)}・前半 ${f2(RK.corr.h1)}・後半 ${f2(RK.corr.h2)}・獨立樣本 ${f2(RK.corr.indep)}</td><td><span class="flag ok">可以,且穩定</span></td></tr>
        <tr><td>能預測接下來跌多深嗎</td><td>獨立樣本相關 ${f2(RK.corr_dd_indep)}</td><td><span class="flag warn">一般情況不能;只看得出最壞情況變壞</span></td></tr>
        <tr><td>用常態分布估區間準嗎</td><td>±1 個標準差實際只涵蓋 ${pc0(RK.cover_1sd_normal)}(常態約 68%)</td><td><span class="flag warn">尾巴比較肥,改用歷史實際分布校準(× ${RK.k68})</span></td></tr></table></div>
      <div class="sm" style="margin:10px 0 6px">預測接下來 ${RK.days} 日波動:今天的波動跟近 3 年平均怎麼配最準(誤差中位數,越小越好)</div>
      <div class="tw"><table><tr>${RK.forecast_err.map(x=>`<th>今天 ${Math.round(x.w*100)}%</th>`).join('')}</tr><tr>${RK.forecast_err.map(x=>`<td>${f2(x.err)}${x.w===RK.today_weight?' ✓':''}</td>`).join('')}</tr></table></div>
      <div class="sm" style="margin:10px 0 6px">各波動組之後 ${RK.days} 日(盤後「風險」面向引用這張)</div>
      <div class="tw"><table><tr><th>波動組</th><th>天數</th><th>當時波動</th><th>之後波動</th><th>常見漲跌</th><th>最深跌中位數</th><th>最深跌最差 1 成</th><th>跌超過 8%</th><th>20 日報酬中位數</th><th>上漲機率</th></tr>
      ${RK.groups.map(g=>`<tr><td>${esc(g.label)}</td><td>${g.n}</td><td>${g.rv_med}%</td><td>${g.frv_med}%</td><td>±${g.range_med}%</td><td class="dn">${g.dd_med}%</td><td class="dn">${g.dd_w10}%</td><td>${g.p8}%<div class="sm mut">獨立 ${g.n_ep} 段中 ${g.ep8} 段</div></td><td class="${cl(g.ret_med)}">${g.ret_med>0?'+':''}${g.ret_med}%</td><td>${g.up}%</td></tr>`).join('')}</table></div>
      <div class="sm" style="margin:10px 0 6px">沒採用的發現:趨勢 × 波動。逐日看「季線之下・波動非高」好像最危險,改成獨立段落就消失了(連續天數重複計算造成的)</div>
      <div class="tw"><table><tr><th>組合</th><th>逐日:跌超過 8%</th><th>獨立段落:跌超過 8%</th></tr>
      ${RK.trend_cells.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.p8}%<div class="sm mut">${c.n} 天</div></td><td>${c.ep8} / ${c.n_ep} 段</td></tr>`).join('')}</table></div>
      <div class="sm mut" style="margin-top:6px">波動只描述震幅、不代表方向:高波動組之後大反彈也比較多。${esc(RK.note||'')}</div></div>`;
  }

  // ── 以下是舊版 v2 評分的完整回測(已停用),收起來當對照紀錄
  h+=`<details class="v2old"><summary>舊版 v2 評分(已停用)完整回測:點開看為什麼不用分數</summary>`;

  // 重點
  h+=`<div class="card"><h2>重點</h2><div class="kpis">
    <div class="kpi"><div class="l">v2 評分總報酬(15:40)</div><div class="v ${cl(L.total)}">${pc(L.total)}</div><div class="sm mut">全程滿倉 ${pc(B.total)}</div></div>
    <div class="kpi"><div class="l">最大回檔</div><div class="v">${pc(L.mdd)}</div><div class="sm mut">全程滿倉 ${pc(B.mdd)}</div></div>
    <div class="kpi"><div class="l">溫度與之後 20 日報酬相關</div><div class="v">${R.ic.fwd20==null?'—':R.ic.fwd20.toFixed(2)}</div><div class="sm mut">正值 = 溫度越高之後越漲;第一年 ${R.ic.fwd20_h1??'—'}、第二年 ${R.ic.fwd20_h2??'—'}</div></div>
    <div class="kpi"><div class="l">平均部位 / 換倉次數</div><div class="v">${pc0(L.avg_expo)}</div><div class="sm mut">換倉 ${L.changes} 次</div></div>
  </div></div>`;

  // 三個目標(對應:轉多抓得到、洗盤敢進場、真下跌跑得快)
  const G=R.goals||{}, gk=['panghu_live'].concat(G.panghu_v3?['panghu_v3']:[]).concat(Object.keys(R.groups||{})), gn=k=>k==='panghu_live'?'v2 全部 13 項':R.names[k];
  const days=x=>x==null?'—':Math.round(x)+' 天';
  const grow=(label,f,hint)=>`<tr><td>${label}<div class="sm mut">${hint}</div></td>${gk.map(k=>`<td>${f(G[k]||{})}</td>`).join('')}</tr>`;
  const g0=G.panghu_live||{};
  h+=`<div class="card"><h2>三個目標</h2><div class="tw"><table><tr><th>目標</th>${gk.map(k=>`<th>${esc(gn(k))}</th>`).join('')}</tr>
    ${grow('① 真下跌少跌幾成',g=>pc0(g.bear_avoided),`跌 15% 以上共 ${g0.bear_n??0} 次;全程滿倉 = 0%`)}
    ${grow('　真下跌在跌到多少時減半',g=>pc(g.bear_cut_at),'越接近 0 代表跑得越快')}
    ${grow('② 洗盤谷底還留幾成部位',g=>pc0(g.wash_expo_trough),`跌 8%~15% 又創新高共 ${g0.wash_n??0} 次;越高代表越敢留`)}
    ${grow('　洗盤後幾天回到七成',g=>days(g.wash_re_days)+(g.wash_never_back?`(${g.wash_never_back} 次沒回來)`:''),'越短越好')}
    ${grow('③ 大底後 60 天吃到幾成漲幅',g=>pc0(g.rally_cap),'真下跌谷底起算;全程滿倉 = 100%')}
  </table></div><div class="sm mut" style="margin-top:6px">洗盤 / 真下跌是事後依跌幅分類,用來打分數;指標本身只能用當下資料判斷,這正是它難的地方。</div></div>`;

  // 策略績效
  h+=`<div class="card"><h2>策略績效</h2><div class="tabs" id="stTabs"><button data-p="all" class="on">全期間</button><button data-p="h1">第一年(樣本內)</button><button data-p="h2">第二年(樣本外)</button></div><div class="tw" id="stTbl"></div>
    <div class="sm mut" style="margin-top:6px">切分日 ${R.split_date}。第一年拿來看要不要調,第二年只驗不調;兩段都要站得住才算數。</div></div>`;

  // 分段:近 3 年完整版 vs 更早精簡版
  const SG=R.segments||{};
  if(SG.full||SG.lite){
    const segRow=(key,label)=>{const x=SG[key];if(!x)return '';const m=x.strategy.panghu_live,b=x.strategy.buy_hold,f=x.strategy.fixed_half,g=(x.goals||{}).panghu_live||{};
      return `<tr><td>${label}<div class="sm mut">${x.range[0]} ～ ${x.range[1]}・${x.n} 天</div></td><td class="${cl(m.total)}">${pc(m.total)}</td><td>${pc(m.mdd)}</td><td class="${cl(b.total)}">${pc(b.total)}</td><td>${pc(b.mdd)}</td><td class="${cl(f.total)}">${pc(f.total)}</td><td>${x.ic20==null?'—':x.ic20.toFixed(2)}</td><td>${x.n_episodes}</td><td>${pc0(g.bear_avoided)}</td><td>${pc0(g.wash_expo_trough)}</td><td>${pc0(g.rally_cap)}</td></tr>`};
    h+=`<div class="card"><h2>分段:近 3 年完整版 vs 更早精簡版</h2><div class="tw"><table><tr><th>區段</th><th>胖虎報酬</th><th>胖虎回檔</th><th>滿倉報酬</th><th>滿倉回檔</th><th>固定五成</th><th>溫度與 20 日相關</th><th>回檔事件</th><th>真下跌少跌</th><th>洗盤谷底部位</th><th>大底後參與</th></tr>
      ${segRow('lite','更早精簡版(缺期貨籌碼)')}${segRow('full','近 3 年完整 13 項')}</table></div>
      <div class="sm mut" style="margin-top:6px">期交所期貨三大法人只開放近 3 年,更早的日子外資期貨多空與散戶多空比不計分。兩段口徑不同,分開看;精簡版主要用來驗「環境判斷」在 2018、2020、2022 等不同行情裡站不站得住。</div></div>`;
  }

  // 淨值
  const eq=R.series.eq;
  h+=`<div class="card"><h2>淨值曲線(起點 1)</h2>${lineChart(keys.map(k=>({name:R.names[k],color:COLORS[k],v:eq[k],dash:k==='fixed_half'?'5 4':null,w:k.startsWith('panghu')?2.4:1.6})),R.series.dates,{fmt:v=>v.toFixed(2),ref:1})}</div>`;

  // 組合比較:全部 / 只看籌碼 / 只看價格趨勢
  const ck=['panghu_live'].concat(Object.keys(R.groups||{})).concat(['buy_hold']);
  const CC={panghu_live:'var(--c-gold)',grp_chips:'var(--c-blue)',grp_price:'var(--teal)',buy_hold:'var(--c-red)'};
  h+=`<div class="card"><h2>組合比較:全部 vs 只看籌碼 vs 只看價格趨勢</h2>
    ${lineChart(ck.map(k=>({name:k==='panghu_live'?'全部 13 項':R.names[k],color:CC[k]||'var(--gray)',v:eq[k],w:k==='panghu_live'?2.4:1.6,dash:k==='buy_hold'?'5 4':null})),R.series.dates,{fmt:v=>v.toFixed(2),ref:1})}
    <div class="tw"><table><tr><th>組合</th><th>總報酬</th><th>最大回檔</th><th>報酬÷回檔</th><th>上漲參與</th><th>下跌承受</th><th>換倉</th><th>溫度與 20 日相關</th></tr>
    ${ck.map(k=>{const m=st.all[k];const ick=k==='panghu_live'?'grp_all':k;return `<tr><td>${k==='panghu_live'?'全部 13 項':R.names[k]}</td><td class="${cl(m.total)}">${pc(m.total)}</td><td>${pc(m.mdd)}</td><td>${m.calmar??'—'}</td><td>${pc0(m.up_cap)}</td><td>${pc0(m.down_cap)}</td><td>${m.changes}</td><td>${R.ic[ick]==null?'—':R.ic[ick].toFixed(2)}</td></tr>`}).join('')}</table></div>
    <div class="sm mut" style="margin-top:6px">只看籌碼 = 外資現貨、外資期貨多空、散戶多空比、P/C、融資;只看價格趨勢 = 趨勢、量能、價量。其他項目權重歸零,溫度用剩下的項目標準化。</div></div>`;

  // 指數 + 溫度 + 建議倉位
  const BANDS=[[0,20,'#3ECF8E30'],[20,40,'#3ECF8E18'],[40,60,'#88888814'],[60,80,'#FF6B6B18'],[80,100,'#FF6B6B30']];
  h+=`<div class="card"><h2>加權指數與胖虎指標</h2>${lineChart([{name:'加權指數',color:'var(--c-red)',v:R.series.close}],R.series.dates,{h:180,legend:false,fmt:v=>Math.round(v).toLocaleString()})}
    ${lineChart([{name:'胖虎指標溫度',color:'var(--c-gold)',v:R.series.temp},{name:'建議倉位 %',color:'var(--c-blue)',v:R.series.pos,w:1.4}],R.series.dates,{h:180,min:0,max:100,bands:BANDS})}</div>`;

  // 溫度分組
  h+=`<div class="card"><h2>溫度分組:之後的平均報酬</h2><div class="tw"><table><tr><th>溫度</th><th>天數</th><th>5 日報酬</th><th>5 日上漲機率</th><th>20 日報酬</th><th>20 日上漲機率</th></tr>
    ${R.buckets.map(b=>`<tr><td>${b.lo}–${b.hi}</td><td>${b.n}</td><td class="${cl(b.fwd5)}">${pc(b.fwd5,2)}</td><td>${pc0(b.hit5)}</td><td class="${cl(b.fwd20)}">${pc(b.fwd20,2)}</td><td>${pc0(b.hit20)}</td></tr>`).join('')}
    <tr><td class="mut">全部平均</td><td></td><td class="${cl(R.uncond[5])}">${pc(R.uncond[5],2)}</td><td></td><td class="${cl(R.uncond[20])}">${pc(R.uncond[20],2)}</td><td></td></tr></table></div>
    <div class="sm mut" style="margin-top:6px">理想狀況:溫度越高那一列的報酬越好。某一列天數太少(個位數)就別太相信。</div></div>`;

  // 回檔事件
  const EP=R.episodes||[];
  h+=`<div class="card"><h2>回檔事件(跌 8% 以上)</h2>${EP.length?`<div class="tw"><table><tr><th>類型</th><th>前高</th><th>谷底</th><th>站回</th><th>跌幅</th><th>前高部位</th><th>谷底部位</th><th>少跌</th><th>減半時跌幅</th><th>回到七成</th><th>60 天參與</th></tr>
    ${EP.map(e=>{const g=e.panghu_live||{};return `<tr><td><span class="flag ${e.kind==='真下跌'?'bad':'warn'}">${e.kind}</span></td><td>${e.peak}</td><td>${e.trough}<div class="sm mut">${e.days_down} 天</div></td><td>${e.recover||'尚未'}${e.days_back!=null?`<div class="sm mut">${e.days_back} 天</div>`:''}</td>
      <td class="dn">${pc(e.depth)}</td><td>${pc0(g.expo_peak)}</td><td>${pc0(g.expo_trough)}</td><td>${pc0(g.avoided)}</td><td>${g.cut_at_dd==null?'沒減半':pc(g.cut_at_dd)}</td>
      <td>${g.re_days==null?'沒回來':g.re_days+' 天'}${g.re_missed?`<div class="sm mut">已漲 ${pc(g.re_missed)}</div>`:''}</td><td>${e.kind==='真下跌'?pc0(g.rally_cap):'—'}</td></tr>`}).join('')}</table></div>`:'<div class="mut">回測期間沒有跌超過 8% 的回檔</div>'}
    <div class="sm mut" style="margin-top:6px">部位與少跌以「胖虎指標(15:40 版)」計。洗盤要看谷底部位高、回到七成快;真下跌要看減半時跌幅小、少跌多。</div></div>`;

  // 各指標
  h+=`<div class="card"><h2>各指標:分數有沒有預測力</h2><div class="tw"><table><tr><th>指標</th><th>權重</th><th>有資料天數</th><th>對 5 日相關</th><th>對 20 日相關</th><th>各分數之後 20 日平均</th></tr>
    ${R.items.map(it=>`<tr><td>${esc(it.name)}</td><td>${it.w}</td><td>${it.n}</td><td class="${cl(it.ic5)}">${it.ic5==null?'—':it.ic5.toFixed(2)}</td><td class="${cl(it.ic20)}">${it.ic20==null?'—':it.ic20.toFixed(2)}</td>
      <td class="ex">${Object.entries(it.by_score).map(([s,v])=>`${s>0?'+':''}${s}:${pc(v.fwd20,1)}(${v.n})`).join('　')||'—'}</td></tr>`).join('')}</table></div>
    <div class="sm mut" style="margin-top:6px">相關為等級相關,正值代表分數給對方向;接近 0 代表這項沒預測力,權重可考慮調低;明顯為負代表方向可能反了。</div></div>`;

  // 情境
  const nb=R.scenarios.filter(r=>r.flag==='方向不符').length, nw=R.scenarios.filter(r=>r.flag==='中性卻有方向').length;
  h+=`<div class="card"><h2>各情境:出現次數與之後表現</h2>
    <div class="sm" style="margin-bottom:8px"><span class="flag bad">方向不符 ${nb}</span>　<span class="flag warn">中性卻有方向 ${nw}</span>　<span class="mut">沒出現過 ${R.untriggered.length} 種</span></div>
    <label class="chk"><input type="checkbox" id="onlyBad"> 只看有問題的</label><div class="tw" id="scTbl"></div></div>`;

  // 參數敏感度
  const SS=R.sensitivity||{rows:[]},SB=SS.base||{};
  const cellS=x=>x&&!x.error?`<b>${typeof x.value==='number'?+x.value.toFixed(3):x.value}</b><div class="sm">${pc(x.total)}・回檔 ${pc(x.mdd)}</div><div class="sm mut">少跌 ${pc0(x.bear_avoided)}・回補 ${days(x.wash_re_days)}</div>`:'<span class="mut">—</span>';
  h+=`<div class="card"><h2>參數敏感度(×0.8 / ×1.2)</h2><div class="sm" style="margin-bottom:6px">目前設定:總報酬 ${pc(SB.total)}・最大回檔 ${pc(SB.mdd)}・真下跌少跌 ${pc0(SB.bear_avoided)}・洗盤回補 ${days(SB.wash_re_days)}</div>
    <div class="tw"><table><tr><th>參數</th><th>目前</th><th>×0.8</th><th>×1.2</th><th>判定</th></tr>
    ${SS.rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${r.base==null?'—':+(+r.base).toFixed(3)}</td><td>${cellS(r.lo)}</td><td>${cellS(r.hi)}</td><td>${r.fragile?'<span class="flag bad">敏感</span>':'<span class="mut">穩</span>'}</td></tr>`).join('')}</table></div>
    <div class="sm mut" style="margin-top:6px">動兩成結果就大翻的數字,多半是剛好擬合這段行情;這種參數寧可取整數、取直觀的值,不要追最佳。</div></div>`;

  // 動作 + 未出現 + 注意
  const actName={out:'跌破第二道',below_line2:'仍在第二道下',down:'跌破防線',below_line:'仍在防線下',fake_break:'假跌破觀察',gate:'外資未買超暫不加碼',up:'升級',weaken:'降級',top:'滿倉',bottom:'空手',steady:'連日維持',hold:'維持'};
  h+=`<div class="card"><h2>紀律動作分布(15:40 版)</h2><div class="tw"><table><tr><th>動作</th><th>天數</th></tr>${Object.entries(R.actions).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${actName[k]||k}</td><td>${v}</td></tr>`).join('')}</table></div></div>`;
  h+=`<div class="card"><h2>回測期間沒出現過的情境</h2><div class="sm">${R.untriggered.map(u=>`${esc(u.name)}・${esc(u.scenario)}(${u.score>0?'+':''}${u.score})`).join('、')||'全部都出現過'}</div></div>`;
  h+=`</details>`;
  h+=`<div class="card"><h2>注意事項</h2><ul class="sm">${R.notes.map(x=>`<li>${esc(x)}</li>`).join('')}<li>這是機械式指標回測,用來找出分數給錯的情境,不是保證未來績效,也不是投資建議。</li></ul></div>`;
  $('#app').innerHTML=h;

  const stTbl=p=>{$('#stTbl').innerHTML=`<table><tr><th>策略</th><th>總報酬</th><th>年化</th><th>最大回檔</th><th>報酬÷回檔</th><th>上漲參與</th><th>下跌承受</th><th>夏普</th><th>平均部位</th><th>換倉</th></tr>
    ${keys.map(k=>{const m=st[p][k];return `<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${COLORS[k]};margin-right:6px"></i>${R.names[k]}</td><td class="${cl(m.total)}">${pc(m.total)}</td><td class="${cl(m.cagr)}">${pc(m.cagr)}</td><td>${pc(m.mdd)}</td><td>${m.calmar??'—'}</td><td>${pc0(m.up_cap)}</td><td>${pc0(m.down_cap)}</td><td>${m.sharpe??'—'}</td><td>${pc0(m.avg_expo)}</td><td>${m.changes}</td></tr>`}).join('')}</table>`};
  stTbl('all');
  document.querySelectorAll('#stTabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#stTabs button').forEach(x=>x.classList.toggle('on',x===b));stTbl(b.dataset.p)});

  const scTbl=()=>{const only=$('#onlyBad').checked;let last='',rows='';
    for(const r of R.scenarios){if(only&&!(r.flag==='方向不符'||r.flag==='中性卻有方向'))continue;
      if(r.name!==last){rows+=`<tr class="grp"><td colspan="8">${esc(r.name)}</td></tr>`;last=r.name}
      const fc=r.flag==='方向不符'?'bad':r.flag==='中性卻有方向'?'warn':'few';
      rows+=`<tr><td>${esc(r.scenario)}</td><td>${r.score>0?'+':''}${r.score}</td><td>${r.n_events??'—'}<div class="sm mut">${r.n} 天</div></td><td class="${cl(r.fwd5)}">${pc(r.fwd5,2)}</td><td class="${cl(r.ev_fwd20??r.fwd20)}">${pc(r.ev_fwd20??r.fwd20,2)}<div class="sm mut">逐日 ${pc(r.fwd20,1)}</div></td><td class="${cl(r.excess20)}">${pc(r.excess20,2)}</td><td>${r.flag?`<span class="flag ${fc}">${r.flag}</span>`:''}</td><td class="ex">${esc(r.example||'')}</td></tr>`}
    $('#scTbl').innerHTML=`<table><tr><th>情境</th><th>分數</th><th>獨立事件</th><th>之後 5 日</th><th>之後 20 日(獨立)</th><th>比平均多</th><th>判定</th><th>最近一次</th></tr>${rows||'<tr><td colspan="8" class="mut">沒有</td></tr>'}</table>`};
  scTbl(); $('#onlyBad').onchange=scTbl;
}

(async()=>{
  let S=null;try{S=await (await fetch('fetch_status.json?'+Date.now())).json()}catch(e){}
  try{const R=await (await fetch('result.json?'+Date.now())).json();render(R,S)}
  catch(e){$('#hdr').textContent='尚未產生回測結果';$('#app').innerHTML=`<div class="card">還沒有回測結果。到 GitHub → Actions → <b>backtest</b> → Run workflow(預設抓兩年,約 40～80 分鐘;抓不完會存進度,再跑一次接著抓)。${S?`<div class="sm mut" style="margin-top:6px">目前已抓 ${S.ok} / ${S.trading_days} 天</div>`:''}</div>`}
})();
</script>
</body>
</html>
